# Production stack: database, API + dashboard, the daily forecast worker, and a nightly dump.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Put secrets in .env (see .env.example). Nothing is published to the internet by this
# file: the app listens on 127.0.0.1:8010 for a reverse proxy to front.
services:
  db:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GANGA_DB_USER:-ganga}
      POSTGRES_PASSWORD: ${GANGA_DB_PASSWORD:?set GANGA_DB_PASSWORD in .env}
      POSTGRES_DB: ${GANGA_DB_NAME:-ganga}
    volumes:
      - dbdata:/home/postgres/pgdata
      - ./ganga/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GANGA_DB_USER:-ganga} -d ${GANGA_DB_NAME:-ganga}"]
      interval: 10s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      GANGA_DB_HOST: db
      GANGA_DB_PORT: "5432"
      GANGA_DB_USER: ${GANGA_DB_USER:-ganga}
      GANGA_DB_PASSWORD: ${GANGA_DB_PASSWORD}
      GANGA_DB_NAME: ${GANGA_DB_NAME:-ganga}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GANGA_TELEGRAM_TOKEN: ${GANGA_TELEGRAM_TOKEN:-}
      GANGA_TELEGRAM_CHAT: ${GANGA_TELEGRAM_CHAT:-}
    ports:
      - "127.0.0.1:8010:8010"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *env
    command: ["python", "scripts/scheduler.py"]

  # Writes one dump per day into ./backups (same-day reruns overwrite). Old dumps are not
  # pruned automatically; clear ./backups yourself or pull them elsewhere.
  backup:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GANGA_DB_PASSWORD}
      PGHOST: db
      PGUSER: ${GANGA_DB_USER:-ganga}
      PGDATABASE: ${GANGA_DB_NAME:-ganga}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    user: root
    entrypoint: ["sh", "/backup.sh"]

volumes:
  dbdata:
