[project]
name = "ganga"
version = "0.1.0"
description = "Ganga river water-quality forecasting decision support system (SIH PS 1694)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.2",
    "rasterio>=1.4",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ganga*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the database container running"]
